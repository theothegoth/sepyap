services:
  postgres:
    image: postgres:15-alpine
    container_name: gm-db
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-sepyap}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gm-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gm-backend
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-grocery_matcher}
      ADMIN_SECRET: ${ADMIN_SECRET:-change-this-secret-key}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
    ports:
      - "3005:3000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - gm-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gm-frontend
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - gm-network
    environment:
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: "http://127.0.0.1:3005/api"
      NEXT_PUBLIC_ADMIN_SECRET: ${ADMIN_SECRET:-change-this-secret-key}

networks:
  gm-network:
    driver: bridge

volumes:
  postgres_data:

